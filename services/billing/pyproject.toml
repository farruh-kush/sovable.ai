[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-routing-billing"
version = "0.1.0"
description = "Billing & Usage Service — cost tracking and activity logs for the AI Routing Layer"
authors = [{ name = "Farruh" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "ai-routing-shared @ file:///${PROJECT_ROOT}/shared",
]

[tool.setuptools.packages.find]
where = ["src"]
