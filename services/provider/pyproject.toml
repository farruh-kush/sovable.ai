[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "ai-routing-provider"
version = "0.1.0"
description = "Provider Adapter Service — LLM provider abstraction for the AI Routing Layer"
authors = [{ name = "Farruh" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "ai-routing-shared @ file:///${PROJECT_ROOT}/shared",
]

[tool.setuptools.packages.find]
where = ["src"]
