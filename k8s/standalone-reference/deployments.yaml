apiVersion: apps/v1
kind: Deployment
metadata: {name: auth, labels: {app.kubernetes.io/name: auth}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: auth}}
  template:
    metadata: {labels: {app.kubernetes.io/name: auth}}
    spec:
      serviceAccountName: ai-routing-reference
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: auth
          image: ghcr.io/replace-me/ai-routing-reference:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.auth.app:app", "--host", "0.0.0.0", "--port", "8101"]
          ports: [{name: http, containerPort: 8101}]
          env:
            - {name: INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: runtime-secrets, key: internal-secret}}}
            - {name: GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: runtime-secrets, key: gateway-api-key}}}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 2}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: router, labels: {app.kubernetes.io/name: router}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: router}}
  template:
    metadata: {labels: {app.kubernetes.io/name: router}}
    spec:
      serviceAccountName: ai-routing-reference
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: router
          image: ghcr.io/replace-me/ai-routing-reference:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.router.app:app", "--host", "0.0.0.0", "--port", "8102"]
          ports: [{name: http, containerPort: 8102}]
          env:
            - {name: INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: runtime-secrets, key: internal-secret}}}
            - {name: ROUTING_CONFIG_PATH, value: /app/config/routing.json}
          volumeMounts: [{name: routing-policy, mountPath: /app/config, readOnly: true}, {name: tmp, mountPath: /tmp}]
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 2}
          resources: {requests: {cpu: 50m, memory: 96Mi}, limits: {cpu: 250m, memory: 256Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      volumes: [{name: routing-policy, configMap: {name: routing-policy}}, {name: tmp, emptyDir: {medium: Memory}}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: provider, labels: {app.kubernetes.io/name: provider}}
spec:
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: provider}}
  template:
    metadata: {labels: {app.kubernetes.io/name: provider}}
    spec:
      serviceAccountName: ai-routing-reference
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: provider
          image: ghcr.io/replace-me/ai-routing-reference:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.provider.app:app", "--host", "0.0.0.0", "--port", "8103"]
          ports: [{name: http, containerPort: 8103}]
          env:
            - {name: INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: runtime-secrets, key: internal-secret}}}
            - {name: PROVIDER_MODE, value: fake}
            - {name: OLLAMA_BASE_URL, value: http://ollama:11434/v1}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5, timeoutSeconds: 2}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 2}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory}}]
---
