---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, labels: {app.kubernetes.io/name: gateway}}
spec:
  replicas: 2
  selector: {matchLabels: {app.kubernetes.io/name: gateway}}
  template:
    metadata: {labels: {app.kubernetes.io/name: gateway}}
    spec:
      serviceAccountName: ai-routing-reference
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: ghcr.io/replace-me/ai-routing-reference:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn", "services.gateway.app:app", "--host", "0.0.0.0", "--port", "8100"]
          ports: [{name: http, containerPort: 8100}]
          env:
            - {name: INTERNAL_SECRET, valueFrom: {secretKeyRef: {name: runtime-secrets, key: internal-secret}}}
            - {name: GATEWAY_API_KEY, valueFrom: {secretKeyRef: {name: runtime-secrets, key: gateway-api-key}}}
            - {name: AUTH_URL, value: http://auth:8101}
            - {name: ROUTER_URL, value: http://router:8102}
            - {name: PROVIDER_URL, value: http://provider:8103}
            - {name: BILLING_URL, value: http://billing:8104}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 15, timeoutSeconds: 3}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {medium: Memory}}]
