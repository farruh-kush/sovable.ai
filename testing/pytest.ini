[pytest]
asyncio_mode = auto
testpaths = backend/shared/tests microservices testing/platform_tests
markers =
    contract: canonical shared schema and route contract checks
    integration: cross-service integration checks with local mocks
    e2e: end-to-end checks against an explicitly configured staging target
    security: security, privacy, and service-isolation checks
    performance: deterministic performance threshold checks
    resilience: timeout, retry, fallback, recovery, and rollback checks
    staging: opt-in staging-only HTTP smoke checks
addopts = --strict-markers
