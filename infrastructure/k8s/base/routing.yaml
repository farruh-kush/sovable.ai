tier_policies:
  free:
    allowed_models: [gpt-4o-mini, claude-3-5-haiku-20241022, gemini-1.5-flash, mistral-small-latest]
    requests_per_minute: 10
    requests_per_day: 100
    monthly_budget_usd: 5.0
    allow_streaming: false
    allow_fallbacks: false
  pro:
    allowed_models: "*"
    requests_per_minute: 100
    requests_per_day: 5000
    monthly_budget_usd: 500.0
    allow_streaming: true
    allow_fallbacks: true
  enterprise:
    allowed_models: "*"
    requests_per_minute: 1000
    requests_per_day: 100000
    monthly_budget_usd: null
    allow_streaming: true
    allow_fallbacks: true
    enable_ab_testing: true
    require_zero_data_retention: true

experiments:
  - id: quality-v1
    status: paused
    salt: quality-v1-2026-08-26
    traffic_percent: 0
    variants: [gpt-4o, claude-3-5-sonnet-20241022]
    eligible_tiers: [enterprise]

observability:
  drift:
    rolling_window_requests: 1000
    quality_drop_threshold: 0.05
    latency_regression_percent: 25
    cost_regression_percent: 20
  promotion:
    min_evaluation_requests: 200
    min_availability: 0.995
    max_masking_leakage: 0
    max_fallback_rate: 0.20
  rollback:
    fallback_rate: 0.35
    p95_latency_multiplier: 2.0
    consecutive_health_failures: 3

deny_list: []
