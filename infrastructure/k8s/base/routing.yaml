# Solvable AI Routing Layer — governed catalog and routing policy.
# Versioned, reviewable configuration. Credentials are environment/secret-manager only.
schema_version: "1.0"
catalog_version: "2026.08.26"
policy_version: "2026.08.26.1"
status: active

reload:
  mode: atomic_snapshot
  poll_interval_seconds: 30
  require_schema_validation: true
  reject_unknown_fields: false
  retain_previous_on_error: true
  audit_event: routing_policy_reload

policy:
  precedence:
    - deny_list
    - tenant_compliance
    - region
    - modality_and_capability
    - quota_and_cost_cap
    - provider_health
    - explicit_provider_order
    - experiment_assignment
    - strategy
    - static_fallback
  tie_breaking:
    - provider_order_in_policy
    - model_id_lexicographic
  retry:
    max_attempts: 3
    retryable_http_statuses: [408, 425, 429, 500, 502, 503, 504]
    base_backoff_ms: 100
    max_backoff_ms: 2000
    retry_stream_after_first_byte: false
  circuit_breaker:
    consecutive_failures_to_open: 3
    open_seconds: 30
    half_open_probe_count: 1
  backpressure:
    max_inflight_per_provider: 200
    queue_timeout_ms: 250
    reject_when_queue_full: true
  audit:
    include_correlation_id: true
    include_reasons: true
    include_candidates: true
    include_masking_summary: true
    redact_secrets: true
    retain_raw_prompt: false
  masking:
    required_before_provider_call: true
    classify: [email, phone, payment_card, uz_personal_id]
    preserve_tenant_isolation: true
    reversible_tokens_request_local: true
    provider_cannot_disable: true

pricing:
  currency: USD
  unit: per_million_tokens
  model_catalog_field: pricing_usd_per_million_tokens
  platform_markup_default: 0.055
  source: governed_model_catalog

