# ── Auth Service ──────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: ai-routing
  labels:
    app: auth
    app.kubernetes.io/component: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: ai-routing-auth:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: auth-url
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: secret-key
            - name: AUTH_INTERNAL_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-internal-secret
                  key: gateway-service-key
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url
            - name: RATE_LIMIT_BACKEND
              value: "redis"
            - name: PUBLIC_BASE_URL
              value: "https://api.sovable.ai"
            - name: FRONTEND_BASE_URL
              value: "https://sovable.ai"
            - name: OTP_DELIVERY_MODE
              value: "disabled"
            - name: ALLOW_DEV_OTP
              value: "false"
            - name: ACTIVATION_EMAIL_PROVIDER
              value: "directmail"
            - name: DIRECTMAIL_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: directmail-access-key-id
            - name: DIRECTMAIL_ACCESS_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: directmail-access-key-secret
            - name: DIRECTMAIL_ENDPOINT
              value: "dm.ap-southeast-1.aliyuncs.com"
            - name: DIRECTMAIL_ACCOUNT_NAME
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: directmail-account-name
            - name: DIRECTMAIL_FROM_ALIAS
              value: "Solvable AI"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: ai-routing
spec:
  selector:
    app: auth
  ports:
    - port: 8001
      targetPort: 8001

---
# ── Router Engine Service ─────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: router
  namespace: ai-routing
  labels:
    app: router
    app.kubernetes.io/component: router
spec:
  replicas: 3
  selector:
    matchLabels:
      app: router
  template:
    metadata:
      labels:
        app: router
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
    spec:
      containers:
        - name: router
          image: ai-routing-router:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url-db1
            - name: PROVIDER_SERVICE_URL
              value: "http://provider:8003"
            - name: BILLING_SERVICE_URL
              value: "http://billing:8004"
            - name: ROUTING_CONFIG_PATH
              value: "/app/config/routing.yaml"
          volumeMounts:
            - name: routing-config
              mountPath: /app/config
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: routing-config
          configMap:
            name: routing-config
---
apiVersion: v1
kind: Service
metadata:
  name: router
  namespace: ai-routing
spec:
  selector:
    app: router
  ports:
    - port: 8002
      targetPort: 8002

---
# ── Provider Adapter Service ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider
  namespace: ai-routing
  labels:
    app: provider
    app.kubernetes.io/component: provider
spec:
  replicas: 2
  selector:
    matchLabels:
      app: provider
  template:
    metadata:
      labels:
        app: provider
    spec:
      containers:
        - name: provider
          image: ai-routing-provider:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8003
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-secrets
                  key: openai-api-key
                  optional: true
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-secrets
                  key: anthropic-api-key
                  optional: true
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-secrets
                  key: google-api-key
                  optional: true
            - name: MISTRAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-secrets
                  key: mistral-api-key
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: provider
  namespace: ai-routing
spec:
  selector:
    app: provider
  ports:
    - port: 8003
      targetPort: 8003

---
# ── Billing Service ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: ai-routing
  labels:
    app: billing
    app.kubernetes.io/component: billing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
    spec:
      containers:
        - name: billing
          image: ai-routing-billing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          env:
            - name: BILLING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: billing-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: url-db2
            - name: PLATFORM_MARKUP
              value: "0.055"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: billing
  namespace: ai-routing
spec:
  selector:
    app: billing
  ports:
    - port: 8004
      targetPort: 8004

---
