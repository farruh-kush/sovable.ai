[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-routing-auth"
version = "0.1.0"
description = "Auth & Identity Service — API key management for the AI Routing Layer"
authors = [{ name = "Farruh" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT>=2.9",
    "httpx>=0.27",
    "structlog>=24.1",
    "ai-routing-shared @ file:///${PROJECT_ROOT}/backend/shared",
]

[tool.setuptools.packages.find]
where = ["src"]
