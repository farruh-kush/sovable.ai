site_name: Solvable AI Documentation
site_url: https://docs.sovable.ai
site_description: Customer-controlled AI infrastructure documentation
repo_url: https://github.com/farruh-kush/sovable.ai
repo_name: farruh-kush/sovable.ai
edit_uri: edit/master/docs-site/docs/
strict: true
use_directory_urls: true
theme:
  name: material
  language: en
  logo: assets/img/favicon.svg
  favicon: assets/img/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to light mode
extra_css:
  - assets/css/custom.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - Home: index.md
  - Platform:
      - Introduction: platform/intro.md
      - Platform rules: platform/rules.md
      - Architecture: platform/architecture.md
      - Security: platform/security.md
      - Data masking: platform/masking.md
      - Reliability: operations/reliability.md
  - Portals:
      - Overview: portals/overview.md
      - User Portal: portals/user.md
      - Organization Admin: portals/organization-admin.md
      - Platform Admin: portals/platform-admin.md
      - Authentication: portals/authentication.md
      - Billing and payments: portals/billing.md
  - Marketplace:
      - Overview: marketplace/overview.md
      - Discover and install: marketplace/discover-install.md
      - Organization governance: marketplace/organization-governance.md
  - Agent Creator:
      - Overview: creator/overview.md
      - Create an agent: creator/create-agent.md
      - Permissions and testing: creator/permissions-testing.md
      - Review and release: creator/review-release.md
      - Settlements: creator/settlements.md
  - Developers:
      - Frontend/backend interaction contract: developers/interaction-contract.md
  - API:
      - Quickstart: api/quickstart.md
      - Generated API reference: api/reference.md
      - OpenAPI JSON: api/openapi.json
copyright: Copyright &copy; 2026 Farruh
