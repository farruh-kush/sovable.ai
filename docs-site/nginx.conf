server {
  listen 80;
  server_name docs.sovable.ai;
  root /usr/share/nginx/html;
  index index.html;
  location = /healthz { add_header Content-Type text/plain; return 200 'ok\n'; }
  location / { try_files $uri $uri/ $uri.html $uri/index.html /404.html; }
  location ~* \.(?:css|js|png|jpg|jpeg|gif|svg|ico|json|woff2)$ { expires 7d; add_header Cache-Control "public, max-age=604800, immutable"; try_files $uri =404; }
  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
