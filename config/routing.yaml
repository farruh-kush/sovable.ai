# ─────────────────────────────────────────────────────────────────────────────
# AI Routing Layer — Routing Configuration
#
# This file is the single source of truth for:
#   - Provider registration and data policies
#   - Model-to-provider static routing and fallback chains
#   - Pricing catalog for cost-optimised routing
#   - Tier-based routing policies
#
# Author: Farruh
# ─────────────────────────────────────────────────────────────────────────────

# ── Provider Registry ─────────────────────────────────────────────────────────
providers:
  openai:
    display_name: "OpenAI"
    base_url: "https://api.openai.com/v1"
    timeout_seconds: 30
    max_retries: 2
    data_policy:
      trains_on_data: false       # Opt-out available via API
      zero_data_retention: true   # ZDR available for Enterprise
      gdpr_compliant: true
      data_residency: ["us", "eu"]

  anthropic:
    display_name: "Anthropic"
    base_url: "https://api.anthropic.com/v1"
    timeout_seconds: 30
    max_retries: 2
    data_policy:
      trains_on_data: false
      zero_data_retention: true
      gdpr_compliant: true
      data_residency: ["us"]

  google:
    display_name: "Google DeepMind"
    base_url: "https://generativelanguage.googleapis.com/v1beta"
    timeout_seconds: 30
    max_retries: 2
    data_policy:
      trains_on_data: true        # Default; disable via API settings
      zero_data_retention: false
      gdpr_compliant: true
      data_residency: ["us", "eu"]

  mistral:
    display_name: "Mistral AI"
    base_url: "https://api.mistral.ai/v1"
    timeout_seconds: 30
    max_retries: 2
    data_policy:
      trains_on_data: false
      zero_data_retention: true
      gdpr_compliant: true
      data_residency: ["eu"]

# ── Model Registry ────────────────────────────────────────────────────────────
models:
  # OpenAI
  "gpt-4o":
    provider: openai
    context_window: 128000
    max_output_tokens: 16384
    supports_vision: true
    supports_function_calling: true
    supports_json_mode: true

  "gpt-4o-mini":
    provider: openai
    context_window: 128000
    max_output_tokens: 16384
    supports_vision: true
    supports_function_calling: true
    supports_json_mode: true

  "gpt-4-turbo":
    provider: openai
    context_window: 128000
    max_output_tokens: 4096
    supports_vision: true
    supports_function_calling: true
    supports_json_mode: true

  "gpt-3.5-turbo":
    provider: openai
    context_window: 16385
    max_output_tokens: 4096
    supports_function_calling: true
    supports_json_mode: true

  "text-embedding-3-small":
    provider: openai
    type: embedding
    dimensions: 1536

  "text-embedding-3-large":
    provider: openai
    type: embedding
    dimensions: 3072

  # Anthropic
  "claude-3-5-sonnet-20241022":
    provider: anthropic
    context_window: 200000
    max_output_tokens: 8192
    supports_vision: true
    supports_function_calling: true
    supports_prompt_caching: true

  "claude-3-5-haiku-20241022":
    provider: anthropic
    context_window: 200000
    max_output_tokens: 8192
    supports_vision: true
    supports_function_calling: true
    supports_prompt_caching: true

  "claude-3-opus-20240229":
    provider: anthropic
    context_window: 200000
    max_output_tokens: 4096
    supports_vision: true
    supports_function_calling: true
    supports_prompt_caching: true

  # Google
  "gemini-1.5-pro":
    provider: google
    context_window: 1000000
    max_output_tokens: 8192
    supports_vision: true
    supports_function_calling: true

  "gemini-1.5-flash":
    provider: google
    context_window: 1000000
    max_output_tokens: 8192
    supports_vision: true
    supports_function_calling: true

  # Mistral
  "mistral-large-latest":
    provider: mistral
    context_window: 128000
    max_output_tokens: 4096
    supports_function_calling: true
    supports_json_mode: true

  "mistral-small-latest":
    provider: mistral
    context_window: 128000
    max_output_tokens: 4096
    supports_function_calling: true

  # Alibaba Model Studio via the OpenAI-compatible endpoint
  "qwen-plus":
    provider: openai
    context_window: 131072
    max_output_tokens: 4096
    supports_function_calling: true
    supports_json_mode: true

# ── Static Routing Table ──────────────────────────────────────────────────────
# Defines the primary provider and fallback chain per model alias.
# The router tries providers in order until one succeeds.
routing:
  "gpt-4o":
    primary: openai
    fallback: ["anthropic"]   # claude-3-5-sonnet as fallback
    strategy: static

  "gpt-4o-mini":
    primary: openai
    fallback: ["mistral"]
    strategy: static

  "claude-3-5-sonnet-20241022":
    primary: anthropic
    fallback: ["openai"]
    strategy: static

  "claude-3-5-haiku-20241022":
    primary: anthropic
    fallback: []
    strategy: static

  "gemini-1.5-pro":
    primary: google
    fallback: ["anthropic"]
    strategy: static

  "gemini-1.5-flash":
    primary: google
    fallback: ["openai"]
    strategy: static

  "mistral-large-latest":
    primary: mistral
    fallback: ["openai"]
    strategy: static

  # Alias: route "cheapest" to the lowest-cost provider dynamically
  "cheapest":
    strategy: cost
    candidates: ["openai", "anthropic", "mistral", "google"]

  # Alias: route "fastest" to the lowest-latency provider dynamically
  "fastest":
    strategy: latency
    candidates: ["openai", "anthropic", "mistral", "google"]

# ── Pricing Catalog (USD per token) ──────────────────────────────────────────
pricing:
  openai:
    "gpt-4o":          { input_per_token: 0.000005,   output_per_token: 0.000015 }
    "gpt-4o-mini":     { input_per_token: 0.00000015, output_per_token: 0.00000060 }
    "gpt-4-turbo":     { input_per_token: 0.00001,    output_per_token: 0.00003 }
    "gpt-3.5-turbo":   { input_per_token: 0.0000005,  output_per_token: 0.0000015 }
    "qwen-plus":      { input_per_token: 0.0000004,  output_per_token: 0.0000012 }
    "text-embedding-v4": { input_per_token: 0.00000007, output_per_token: 0.0 }

  anthropic:
    "claude-3-5-sonnet-20241022": { input_per_token: 0.000003,   output_per_token: 0.000015 }
    "claude-3-5-haiku-20241022":  { input_per_token: 0.0000008,  output_per_token: 0.000004 }
    "claude-3-opus-20240229":     { input_per_token: 0.000015,   output_per_token: 0.000075 }

  google:
    "gemini-1.5-pro":   { input_per_token: 0.0000035, output_per_token: 0.0000105 }
    "gemini-1.5-flash": { input_per_token: 0.00000035, output_per_token: 0.00000105 }

  mistral:
    "mistral-large-latest": { input_per_token: 0.000002, output_per_token: 0.000006 }
    "mistral-small-latest": { input_per_token: 0.0000002, output_per_token: 0.0000006 }

# ── Tier-Based Routing Policies ───────────────────────────────────────────────
# Phase 2 — Task 2.2: Different routing behaviour per API key tier
tier_policies:
  free:
    allowed_models:
      - "gpt-4o-mini"
      - "claude-3-5-haiku-20241022"
      - "gemini-1.5-flash"
      - "mistral-small-latest"
    requests_per_minute: 10
    requests_per_day: 100
    monthly_budget_usd: 5.0
    enable_caching: true
    enable_streaming: false

  pro:
    allowed_models: "*"   # All models
    requests_per_minute: 100
    requests_per_day: 5000
    monthly_budget_usd: 500.0
    enable_caching: true
    enable_streaming: true
    enable_fallbacks: true

  enterprise:
    allowed_models: "*"
    requests_per_minute: 1000
    requests_per_day: 100000
    monthly_budget_usd: null   # No cap
    enable_caching: true
    enable_streaming: true
    enable_fallbacks: true
    enable_ab_testing: true
    zero_data_retention: true

  "qwen-plus":
    primary: openai
    fallback: ["mistral"]
    strategy: static
