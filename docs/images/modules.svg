<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <style>
    .box { fill:#ffffff; stroke:#111827; stroke-width:1.2px; rx:6; }
    .title { font: 600 14px 'Helvetica Neue', Arial; fill:#0f172a; }
    .label { font: 500 12px 'Helvetica Neue', Arial; fill:#111827; }
    .small { font: 400 11px 'Helvetica Neue', Arial; fill:#475569; }
    .arrow { stroke:#0f172a; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a" />
    </marker>
  </defs>
  <title>AI Routing Layer - Modules</title>
  <desc>Logical modules diagram mapping API Gateway, Auth, Dashboard, Routing Engine, Billing, Provider Adapters, and Persistence. Grouped for design import.</desc>

  <g id="layer-modules" data-layer="Modules">
  <!-- Left column -->
  <rect x="40" y="40" width="220" height="80" class="box"/>
  <text x="60" y="65" class="title">API Gateway</text>
  <text x="60" y="85" class="small">Auth, rate limit, validation</text>

  <rect x="40" y="140" width="220" height="80" class="box"/>
  <text x="60" y="165" class="title">Auth Service</text>
  <text x="60" y="185" class="small">OAuth, API keys</text>

  <rect x="40" y="240" width="220" height="80" class="box"/>
  <text x="60" y="265" class="title">Dashboard</text>
  <text x="60" y="285" class="small">Keys, usage, billing</text>

  <!-- Middle column -->
  <rect x="350" y="40" width="220" height="120" class="box"/>
  <text x="370" y="65" class="title">Routing Engine</text>
  <text x="370" y="90" class="small">Dynamic scoring, fallback</text>
  <text x="370" y="110" class="small">Retries &amp; circuit breaker</text>

  <rect x="350" y="180" width="220" height="120" class="box"/>
  <text x="370" y="205" class="title">Billing</text>
  <text x="370" y="230" class="small">Usage, cost estimation, Stripe</text>

  <!-- Right column -->
  <rect x="700" y="40" width="160" height="120" class="box"/>
  <text x="720" y="65" class="title">Provider Adapters</text>
  <text x="720" y="90" class="small">OpenAI, Anthropic, ...</text>

  <rect x="700" y="180" width="160" height="120" class="box"/>
  <text x="720" y="205" class="title">Persistence</text>
  <text x="720" y="230" class="small">Postgres, Redis</text>

  <!-- connections -->
  <path d="M 260 80 L 350 80" class="arrow"/>
  <path d="M 260 200 L 350 240" class="arrow"/>
  <path d="M 570 100 L 700 100" class="arrow"/>
  <path d="M 570 240 L 700 240" class="arrow"/>

  <text x="40" y="340" class="small">Editable SVG: modify text, colors, or layout with any text editor.</text>
</svg>