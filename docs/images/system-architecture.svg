<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style>
      .background { fill: #ffffff; }
      .section { fill: #f3f4f6; stroke: #d1d5db; stroke-width: 2; stroke-dasharray: 5,5; rx: 12; }
      .service-box { fill: #dbeafe; stroke: #0284c7; stroke-width: 2; rx: 8; }
      .external-box { fill: #fef3c7; stroke: #d97706; stroke-width: 2; rx: 8; }
      .storage-box { fill: #d1fae5; stroke: #059669; stroke-width: 2; rx: 8; }
      .title { font: bold 16px 'Segoe UI', Arial; fill: #0f172a; }
      .subtitle { font: 500 13px 'Segoe UI', Arial; fill: #1f2937; }
      .small { font: 400 11px 'Segoe UI', Arial; fill: #4b5563; }
      .arrow { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; marker-end: url(#arrowhead-gray); }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 Z" fill="#1f2937" />
    </marker>
    <marker id="arrowhead-gray" viewBox="0 0 10 10" refX="9" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 3 L 0 6 Z" fill="#6b7280" />
    </marker>
  </defs>

  <rect width="1400" height="900" class="background"/>

  <!-- Title -->
  <text x="700" y="30" class="title" text-anchor="middle">AI Routing Layer - System Architecture</text>
  <text x="700" y="50" class="small" text-anchor="middle">Microservice architecture with independent scaling and fault tolerance</text>

  <!-- Client Layer -->
  <rect x="30" y="80" width="180" height="80" class="external-box"/>
  <text x="120" y="105" class="subtitle" text-anchor="middle">Clients</text>
  <text x="120" y="125" class="small" text-anchor="middle">SDKs, Web UI</text>
  <text x="120" y="140" class="small" text-anchor="middle">Curl, Direct API</text>

  <!-- Arrow -->
  <path d="M 210 120 L 280 120" class="arrow"/>

  <!-- API Gateway Service -->
  <rect x="280" y="80" width="200" height="140" class="service-box"/>
  <text x="380" y="105" class="subtitle" text-anchor="middle">API Gateway</text>
  <text x="380" y="125" class="small" text-anchor="middle">• Authentication</text>
  <text x="380" y="140" class="small" text-anchor="middle">• Rate Limiting</text>
  <text x="380" y="155" class="small" text-anchor="middle">• Request Validation</text>
  <text x="380" y="170" class="small" text-anchor="middle">• OpenAPI Docs</text>
  <text x="380" y="185" class="small" text-anchor="middle">• Error Handling</text>

  <!-- Arrow to Routing -->
  <path d="M 480 150 L 550 150" class="arrow"/>

  <!-- Routing Service -->
  <rect x="550" y="80" width="220" height="140" class="service-box"/>
  <text x="660" y="105" class="subtitle" text-anchor="middle">Routing Service</text>
  <text x="660" y="125" class="small" text-anchor="middle">• Route Selection</text>
  <text x="660" y="140" class="small" text-anchor="middle">• Retry Logic</text>
  <text x="660" y="155" class="small" text-anchor="middle">• Circuit Breaker</text>
  <text x="660" y="170" class="small" text-anchor="middle">• Load Balancing</text>
  <text x="660" y="185" class="small" text-anchor="middle">• Streaming Support</text>

  <!-- Arrow to Providers -->
  <path d="M 770 150 L 840 150" class="arrow"/>

  <!-- Provider Service -->
  <rect x="840" y="80" width="220" height="140" class="service-box"/>
  <text x="950" y="105" class="subtitle" text-anchor="middle">Provider Service</text>
  <text x="950" y="125" class="small" text-anchor="middle">• OpenAI Adapter</text>
  <text x="950" y="140" class="small" text-anchor="middle">• Anthropic Adapter</text>
  <text x="950" y="155" class="small" text-anchor="middle">• Custom Providers</text>
  <text x="950" y="170" class="small" text-anchor="middle">• Health Monitoring</text>
  <text x="950" y="185" class="small" text-anchor="middle">• Rate Limit Mgmt</text>

  <!-- External Services Box -->
  <path d="M 1080 120 L 1140 120" class="arrow"/>
  <rect x="1140" y="80" width="200" height="140" class="external-box"/>
  <text x="1240" y="105" class="subtitle" text-anchor="middle">External APIs</text>
  <text x="1240" y="125" class="small" text-anchor="middle">• OpenAI</text>
  <text x="1240" y="140" class="small" text-anchor="middle">• Anthropic</text>
  <text x="1240" y="155" class="small" text-anchor="middle">• Other Providers</text>
  <text x="1240" y="170" class="small" text-anchor="middle">• Third-party APIs</text>

  <!-- Dashed arrows back to Gateway -->
  <path d="M 950 220 L 950 260 L 660 260 L 660 220" class="arrow-dashed"/>
  <path d="M 660 220 L 660 260 L 380 260 L 380 220" class="arrow-dashed"/>

  <!-- Support Services Layer -->
  <!-- Billing Service -->
  <rect x="30" y="300" width="220" height="120" class="service-box"/>
  <text x="140" y="325" class="subtitle" text-anchor="middle">Billing Service</text>
  <text x="140" y="345" class="small" text-anchor="middle">• Usage Tracking</text>
  <text x="140" y="360" class="small" text-anchor="middle">• Cost Calculation</text>
  <text x="140" y="375" class="small" text-anchor="middle">• Invoice Generation</text>
  <text x="140" y="390" class="small" text-anchor="middle">• Quota Management</text>

  <!-- Auth Service -->
  <rect x="280" y="300" width="220" height="120" class="service-box"/>
  <text x="390" y="325" class="subtitle" text-anchor="middle">Auth Service</text>
  <text x="390" y="345" class="small" text-anchor="middle">• OAuth Providers</text>
  <text x="390" y="360" class="small" text-anchor="middle">• API Key Mgmt</text>
  <text x="390" y="375" class="small" text-anchor="middle">• Token Validation</text>
  <text x="390" y="390" class="small" text-anchor="middle">• User Accounts</text>

  <!-- Cache Service -->
  <rect x="530" y="300" width="220" height="120" class="service-box"/>
  <text x="640" y="325" class="subtitle" text-anchor="middle">Cache Service</text>
  <text x="640" y="345" class="small" text-anchor="middle">• Rate Limit Cache</text>
  <text x="640" y="360" class="small" text-anchor="middle">• Session Storage</text>
  <text x="640" y="375" class="small" text-anchor="middle">• Config Cache</text>
  <text x="640" y="390" class="small" text-anchor="middle">• Response Cache</text>

  <!-- Observability Service -->
  <rect x="780" y="300" width="220" height="120" class="service-box"/>
  <text x="890" y="325" class="subtitle" text-anchor="middle">Observability</text>
  <text x="890" y="345" class="small" text-anchor="middle">• Prometheus Metrics</text>
  <text x="890" y="360" class="small" text-anchor="middle">• OpenTelemetry</text>
  <text x="890" y="375" class="small" text-anchor="middle">• Structured Logs</text>
  <text x="890" y="390" class="small" text-anchor="middle">• Health Checks</text>

  <!-- Dashboard Service -->
  <rect x="1030" y="300" width="220" height="120" class="service-box"/>
  <text x="1140" y="325" class="subtitle" text-anchor="middle">Dashboard &amp; Web</text>
  <text x="1140" y="345" class="small" text-anchor="middle">• Marketing Site</text>
  <text x="1140" y="360" class="small" text-anchor="middle">• Dev Dashboard</text>
  <text x="1140" y="375" class="small" text-anchor="middle">• Admin Console</text>
  <text x="1140" y="390" class="small" text-anchor="middle">• API Playground</text>

  <!-- Arrows from main services to support services -->
  <path d="M 380 220 L 140 300" class="arrow-dashed" stroke-dasharray="3,3"/>
  <path d="M 380 220 L 390 300" class="arrow-dashed" stroke-dasharray="3,3"/>
  <path d="M 660 220 L 640 300" class="arrow-dashed" stroke-dasharray="3,3"/>
  <path d="M 950 220 L 890 300" class="arrow-dashed" stroke-dasharray="3,3"/>
  <path d="M 380 220 L 1140 300" class="arrow-dashed" stroke-dasharray="3,3"/>

  <!-- Data Layer -->
  <!-- Main Section -->
  <rect x="30" y="490" width="600" height="240" class="section"/>
  <text x="340" y="515" class="subtitle" text-anchor="middle">Persistent Storage Layer</text>

  <!-- PostgreSQL -->
  <rect x="50" y="540" width="220" height="160" class="storage-box"/>
  <text x="160" y="565" class="subtitle" text-anchor="middle">PostgreSQL</text>
  <text x="160" y="585" class="small" text-anchor="middle">• Users &amp; Auth</text>
  <text x="160" y="600" class="small" text-anchor="middle">• API Keys</text>
  <text x="160" y="615" class="small" text-anchor="middle">• Usage Records</text>
  <text x="160" y="630" class="small" text-anchor="middle">• Billing Data</text>
  <text x="160" y="645" class="small" text-anchor="middle">• Routing Config</text>
  <text x="160" y="660" class="small" text-anchor="middle">• Audit Logs</text>

  <!-- Redis Cache -->
  <rect x="300" y="540" width="220" height="160" class="storage-box"/>
  <text x="410" y="565" class="subtitle" text-anchor="middle">Redis Cache</text>
  <text x="410" y="585" class="small" text-anchor="middle">• Rate Limits</text>
  <text x="410" y="600" class="small" text-anchor="middle">• Session Data</text>
  <text x="410" y="615" class="small" text-anchor="middle">• Config Cache</text>
  <text x="410" y="630" class="small" text-anchor="middle">• Provider Health</text>
  <text x="410" y="645" class="small" text-anchor="middle">• Circuit Breaker</text>
  <text x="410" y="660" class="small" text-anchor="middle">• State</text>

  <!-- Infrastructure Section -->
  <rect x="680" y="490" width="700" height="240" class="section"/>
  <text x="1030" y="515" class="subtitle" text-anchor="middle">Infrastructure &amp; DevOps</text>

  <!-- Monitoring -->
  <rect x="700" y="540" width="200" height="160" class="external-box"/>
  <text x="800" y="565" class="subtitle" text-anchor="middle">Monitoring</text>
  <text x="800" y="585" class="small" text-anchor="middle">• Prometheus</text>
  <text x="800" y="600" class="small" text-anchor="middle">• Grafana</text>
  <text x="800" y="615" class="small" text-anchor="middle">• Alerts</text>
  <text x="800" y="630" class="small" text-anchor="middle">• Dashboard</text>
  <text x="800" y="645" class="small" text-anchor="middle">• Thresholds</text>

  <!-- Logging -->
  <rect x="940" y="540" width="200" height="160" class="external-box"/>
  <text x="1040" y="565" class="subtitle" text-anchor="middle">Logging</text>
  <text x="1040" y="585" class="small" text-anchor="middle">• ELK Stack</text>
  <text x="1040" y="600" class="small" text-anchor="middle">• Structured Logs</text>
  <text x="1040" y="615" class="small" text-anchor="middle">• Search &amp; Filter</text>
  <text x="1040" y="630" class="small" text-anchor="middle">• Retention</text>
  <text x="1040" y="645" class="small" text-anchor="middle">• Analysis</text>

  <!-- Container Orchestration -->
  <rect x="1180" y="540" width="200" height="160" class="external-box"/>
  <text x="1280" y="565" class="subtitle" text-anchor="middle">Orchestration</text>
  <text x="1280" y="585" class="small" text-anchor="middle">• Kubernetes</text>
  <text x="1280" y="600" class="small" text-anchor="middle">• Docker</text>
  <text x="1280" y="615" class="small" text-anchor="middle">• Auto-scaling</text>
  <text x="1280" y="630" class="small" text-anchor="middle">• Service Mesh</text>
  <text x="1280" y="645" class="small" text-anchor="middle">• Load Balancing</text>

  <!-- Deployment Environments -->
  <!-- Development -->
  <rect x="30" y="790" width="320" height="80" class="external-box"/>
  <text x="190" y="815" class="subtitle" text-anchor="middle">Development</text>
  <text x="190" y="835" class="small" text-anchor="middle">Local Docker Compose, SQLite, In-Memory Cache</text>

  <!-- Staging -->
  <rect x="390" y="790" width="320" height="80" class="external-box"/>
  <text x="550" y="815" class="subtitle" text-anchor="middle">Staging</text>
  <text x="550" y="835" class="small" text-anchor="middle">Kubernetes Cluster, PostgreSQL, Redis, Full Monitoring</text>

  <!-- Production -->
  <rect x="750" y="790" width="620" height="80" class="external-box"/>
  <text x="1060" y="815" class="subtitle" text-anchor="middle">Production</text>
  <text x="1060" y="835" class="small" text-anchor="middle">Multi-zone Kubernetes, RDS, ElastiCache, CDN, WAF, Auto-scaling, Disaster Recovery</text>

</svg>
