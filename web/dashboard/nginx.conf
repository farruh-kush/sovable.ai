server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  location = /portal/ {
    try_files /portal.html =404;
  }
  location = /portals/ {
    try_files /portals.html =404;
  }
  location = /admin/ {
    try_files /admin.html =404;
  }
  location = /controller/ {
    try_files /controller.html =404;
  }
  location = /creator/ {
    try_files /creator.html =404;
  }

  location / {
    try_files $uri.html $uri $uri/ =404;
  }
}
