# Prometheus configuration for the AI Routing Layer
# Author: Farruh

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "${APP_ENV:-development}"
    project: "ai-routing-layer"

rule_files:
  - "rules/*.yml"

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8000"]
    metrics_path: /metrics

  - job_name: "router"
    static_configs:
      - targets: ["router:8002"]
    metrics_path: /metrics

  - job_name: "provider"
    static_configs:
      - targets: ["provider:8003"]
    metrics_path: /metrics

  - job_name: "billing"
    static_configs:
      - targets: ["billing:8004"]
    metrics_path: /metrics

  - job_name: "redis"
    static_configs:
      - targets: ["redis:6379"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres:5432"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
