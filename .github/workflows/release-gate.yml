name: Solvable AI Release Gate

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PLATFORM_TARGET_ENV: ci
      PYTHONPATH: backend/shared/src:microservices/auth/src:microservices/billing/src:microservices/gateway/src:microservices/provider/src:microservices/router/src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install reproducible test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'pytest>=8,<9' 'pytest-asyncio>=0.23,<1' \
            'pydantic>=2.7,<3' 'fastapi>=0.111,<1' \
            'httpx>=0.27,<1' 'respx>=0.21,<1' \
            'sqlalchemy[asyncio]>=2,<3' aiosqlite asyncpg \
            'redis[hiredis]>=5,<6' 'PyJWT>=2.9,<3' \
            'pyyaml>=6,<7' structlog prometheus-client uvicorn
          python -m pip install -e backend/shared
      - name: Run service and platform release tests
        run: ./testing/scripts/run_tests.sh
      - name: Run dependency-free ACK overlay render when kubectl exists
        run: |
          if command -v kubectl >/dev/null 2>&1; then
            kubectl kustomize infrastructure/k8s/overlays/alibaba >/tmp/ack-rendered.yaml
            test "$(grep -c '^kind: Deployment$' /tmp/ack-rendered.yaml)" -eq 6
            test "$(grep -c '^kind: Service$' /tmp/ack-rendered.yaml)" -eq 6
          else
            echo 'kubectl unavailable; platform tests still provide manifest structure coverage.'
          fi
      - name: Upload masked test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solvable-release-gate-evidence
          path: testing/evidence/
          if-no-files-found: ignore
