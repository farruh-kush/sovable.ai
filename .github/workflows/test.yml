name: Solvable AI Release Gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            alembic asyncpg fastapi httpx 'redis[hiredis]' \
            'sqlalchemy[asyncio]' structlog prometheus-client \
            pydantic pydantic-settings PyJWT pyyaml \
            pytest pytest-asyncio respx uvicorn
          python -m pip install -e backend/shared
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/dashboard/package-lock.json
      - name: Run whole-platform release gate
        run: ./testing/scripts/release_gate.sh
