name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            alembic asyncpg fastapi httpx 'redis[hiredis]' \
            'sqlalchemy[asyncio]' structlog prometheus-client \
            pydantic pydantic-settings PyJWT pyyaml \
            pytest pytest-asyncio respx uvicorn
          python -m pip install -e shared
      - name: Run service and shared tests
        env:
          PYTHONPATH: shared/src:services/auth/src:services/billing/src:services/gateway/src:services/provider/src:services/router/src
        run: |
          python -m pytest \
            shared/tests \
            services/auth/tests \
            services/billing/tests \
            services/gateway/tests \
            services/provider/tests \
            services/router/tests \
            -v
