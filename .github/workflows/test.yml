name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            alembic asyncpg fastapi httpx 'redis[hiredis]' \
            'sqlalchemy[asyncio]' structlog prometheus-client \
            pydantic pydantic-settings PyJWT pyyaml \
            pytest pytest-asyncio respx uvicorn
          python -m pip install -e backend/shared
      - name: Run service and shared tests
        env:
          PYTHONPATH: backend/shared/src:microservices/auth/src:microservices/billing/src:microservices/gateway/src:microservices/provider/src:microservices/router/src
        run: |
          python -m pytest \
            backend/shared/tests \
            microservices/auth/tests \
            microservices/billing/tests \
            microservices/gateway/tests \
            microservices/provider/tests \
            microservices/router/tests \
            -v
