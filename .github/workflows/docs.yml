name: Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs-site/requirements.txt
      - name: Install documentation dependencies
        run: pip install -r requirements.txt
      - name: Regenerate API Markdown from OpenAPI
        env:
          OPENAPI_SOURCE: https://api.sovable.ai/openapi.json
        run: python scripts/fetch_openapi_and_render.py
      - name: Build strict documentation
        run: mkdocs build --strict
      - name: Upload static documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: solvable-docs-site
          path: docs-site/site
          if-no-files-found: error
