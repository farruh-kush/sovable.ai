version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# AI Routing Layer — Docker Compose (Development / Local)
#
# Starts all microservices, infrastructure dependencies, and the
# observability stack in a single command:
#   docker compose up --build
#
# Author: Farruh
# ─────────────────────────────────────────────────────────────────────────────

x-build-context: &build-context
  context: .

x-common-env: &common-env
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  REDIS_URL: "redis://redis:6379/0"

x-healthcheck-defaults: &hc-defaults
  interval: 30s
  timeout: 10s
  retries: 5
  start_period: 15s

services:

  # ── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_MULTIPLE_DATABASES: "auth_db,billing_db"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/observability/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    ports:
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      <<: *hc-defaults

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      <<: *hc-defaults

  # ── Core Microservices ──────────────────────────────────────────────────────

  gateway:
    build:
      <<: *build-context
      dockerfile: microservices/gateway/Dockerfile
    restart: unless-stopped
    ports:
      - "${GATEWAY_HOST_PORT:-18000}:8000"
    environment:
      <<: *common-env
      APP_ENV: "${APP_ENV:-development}"
      AUTH_SERVICE_URL: "http://auth:8001"
      ROUTER_SERVICE_URL: "http://router:8002"
      BILLING_SERVICE_URL: "http://billing:8004"
      ADMIN_API_KEY: "${ADMIN_API_KEY:-change-me-in-production}"
      CORS_ORIGINS: '["*"]'
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *hc-defaults
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"

  auth:
    build:
      <<: *build-context
      dockerfile: microservices/auth/Dockerfile
    restart: unless-stopped
    ports:
      - "${AUTH_HOST_PORT:-18001}:8001"
    environment:
      <<: *common-env
      DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/auth_db"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *hc-defaults

  router:
    build:
      <<: *build-context
      dockerfile: microservices/router/Dockerfile
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      REDIS_URL: "redis://redis:6379/1"
      PROVIDER_SERVICE_URL: "http://provider:8003"
      BILLING_SERVICE_URL: "http://billing:8004"
      ROUTING_CONFIG_PATH: "/app/config/routing.yaml"
    volumes:
      - ./ai/config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      provider:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      <<: *hc-defaults
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8002"
      - "prometheus.path=/metrics"

  provider:
    build:
      <<: *build-context
      dockerfile: microservices/provider/Dockerfile
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.openai.com/v1}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      GOOGLE_API_KEY: "${GOOGLE_API_KEY:-}"
      MISTRAL_API_KEY: "${MISTRAL_API_KEY:-}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/adapt/health')"]
      <<: *hc-defaults

  billing:
    build:
      <<: *build-context
      dockerfile: microservices/billing/Dockerfile
    restart: unless-stopped
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      REDIS_URL: "redis://redis:6379/2"
      BILLING_DATABASE_URL: "postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/billing_db"
      PLATFORM_MARKUP: "${PLATFORM_MARKUP:-0.055}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      <<: *hc-defaults

  # ── Observability Stack ─────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-19090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    depends_on:
      - gateway
      - router

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-13000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ── Logging (ELK-lite) ──────────────────────────────────────────────────────

  loki:
    image: grafana/loki:2.9.7
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:2.9.7
    restart: unless-stopped
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infrastructure/observability/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  default:
    name: ai-routing-network
